inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082
model_store=/home/torchserve/model-store
load_models=all

# Workers default to the CPU count, which loads one copy of each model per worker
# (20 workers used 17GB on a 20-core host). The target VM has 16GB total and
# serves few concurrent requests, so keep one worker per model.
default_workers_per_model=1
job_queue_size=20
