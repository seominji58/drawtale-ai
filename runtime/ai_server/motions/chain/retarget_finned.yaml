# 사슬형 · 지느러미형 대응표 (11/5 시험) — 동작 파일(사람 걷기)은 장 수 · 박자만 쓰고 뼈는 하나도 대응시키지 않는다.
# 마디 방향은 renderer._apply_wave 가 형태 정의의 물결(waves)로 넣는다. 크기 맞춤(root offset)만 몸 끝 마디로
char_starting_location: [-0.3, -0.2, -0.5]
bvh_projection_bodypart_groups:
- bvh_joint_names: [RightUpLeg, RightLeg, RightFoot, RightToeBase, LeftUpLeg, LeftLeg, LeftFoot, LeftToeBase]
  method: pca
  name: Lower Limbs
- bvh_joint_names: [Hips, Spine, Spine1, Neck, Head, RightShoulder, RightArm, RightForeArm, RightHand, LeftShoulder, LeftArm, LeftForeArm, LeftHand]
  method: frontal
  name: Trunk
char_bodypart_groups:
- bvh_depth_drivers: [Hips]
  char_joints: [head, b1, b2, b3, tail]
char_bvh_root_offset:
  bvh_projection_bodypart_group_for_offset: Lower Limbs
  bvh_joints:
  - [RightFoot, RightLeg, RightUpLeg]
  char_joints:
  - [tail, b3, b2]
char_joint_bvh_joints_mapping: {}
char_runtime_checks: []
